[workspace]
resolver = "2"
members = [
    "crates/phonecontrol-protocol",
    "crates/phonecontrol-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["PhoneFarm"]

[workspace.dependencies]
phonecontrol-protocol = { path = "crates/phonecontrol-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
