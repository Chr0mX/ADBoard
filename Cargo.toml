[workspace]
resolver = "2"
members = [
    "crates/adboard-protocol",
    "crates/adboard-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ADBoard"]

[workspace.dependencies]
adboard-protocol = { path = "crates/adboard-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
