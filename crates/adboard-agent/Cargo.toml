[package]
name = "adboard-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ADBoard Linux agent — ADB discovery, device manager, HTTP + WebSocket API"
default-run = "adboard-agent"

[[bin]]
name = "adboard-agent"
path = "src/main.rs"

[dependencies]
adboard-protocol = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# rustls + ring: agents can join a controller published over https/wss
# (e.g. behind Cloudflare). ring cross-compiles with MinGW; aws-lc-rs needs CMake.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# PBKDF2 password hashing for the browser sign-in (already pulled in by rustls).
ring = "0.17"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
qrcode = "0.14"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Text steps (OCR): ocrs is pure Rust (no Tesseract/ONNX DLLs), so it builds the
# same for Linux and the MinGW Windows pack. Its models come from fetch-deps.
ocrs = { version = "0.13", default-features = false, features = ["rten"] }
rten = { version = "0.26", default-features = false }
rten-imageproc = "0.26"
png = "0.18"
regex = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
