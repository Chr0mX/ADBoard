[package]
name = "phonecontrol-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rasiel Linux agent — ADB discovery, device manager, HTTP + WebSocket API"
default-run = "rasiel-agent"

[[bin]]
name = "rasiel-agent"
path = "src/main.rs"

[dependencies]
phonecontrol-protocol = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# rustls + ring: agents can join a controller published over https/wss
# (e.g. behind Cloudflare). ring cross-compiles with MinGW; aws-lc-rs needs CMake.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
qrcode = "0.14"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
