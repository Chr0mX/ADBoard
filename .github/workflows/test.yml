name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Lets the OCR test read a real screenshot with the real models.
      - name: OCR models
        run: FETCH_ONLY=ocr FETCH_TARGET=linux bash scripts/fetch-deps.sh
      - name: Cargo test
        run: cargo test --workspace

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Unit tests
        # Every src/**/*.test.ts and *.test.mjs, found by pattern. A new test
        # file is picked up without editing this workflow.
        run: npm test
      - name: Typecheck
        # LayoutProps and next-env.d.ts come from Next's generated route types.
        run: npm run typecheck
      - name: Lint
        # Source only (dist, target and temp are ignored in eslint.config.mjs).
        # Not blocking yet: a few older react-hooks errors are still open
        # (phone-screen, floating-panel, adboard-app, developer-panel).
        run: npm run lint
        continue-on-error: true
      - name: Production build
        run: npm run build
