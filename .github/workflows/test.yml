name: test

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test
        run: cargo test --workspace

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: node --experimental-strip-types --test src/lib/video/fit-box.test.ts src/lib/desk/gesture.test.ts src/lib/ui/floating-clamp.test.ts src/lib/ui/mobile-stats-mode.test.ts src/lib/ui/document-title.test.ts src/lib/scrcpy/keyboard.test.mjs src/lib/api/http-error.test.ts src/lib/ui/taskbar-pins.test.ts src/lib/ui/connection-copy.test.ts
      - name: Typecheck
        # LayoutProps and next-env.d.ts come from Next's generated route types.
        run: npx next typegen && npx tsc --noEmit
