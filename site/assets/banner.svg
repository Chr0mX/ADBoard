ound"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g><text x="990" y="222" font-size="27" font-weight="600" fill="#f1f5f9">Automation</text><text x="990" y="257" font-size="20" fill="#9aa4b2">Macros and</text><text x="990" y="285" font-size="20" fill="#9aa4b2">batch actions</text><rect x="712" y="330" width="230" height="206" rx="24" fill="#1b2130"/><g transform="translate(740 358) scale(1.5833)" fill="none" stroke="#86e3c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></g><text x="740" y="448" font-size="27" font-weight="600" fill="#f1f5f9">ADB Terminal</text><text x="740" y="483" font-size="20" fill="#9aa4b2">Shell and device</text><text x="740" y="511" font-size="20" fill="#9aa4b2">commands</text><rect x="962" y="330" width="230" height="206" rx="24" fill="#1b2130"/><g transform="translate(990 358) scale(1.5833)" fill="none" stroke="#f5c98a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></g><text x="990" y="448" font-size="27" font-weight="600" fill="#f1f5f9">Device Fleet</text><text x="990" y="483" font-size="20" fill="#9aa4b2">Manage every</text><text x="990" y="511" font-size="20" fill="#9aa4b2">connected phone</text></g></svg>
